<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quality Advent Calendar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #12404c 0%, #092d37 45%, #061f28 100%);
}

/* HEADER */

header {
    text-align: center;
    padding: 45px 20px 20px;
}

.eyebrow {
    color: #ff7900;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
}

h1 {
    margin: 10px 0;
    font-size: clamp(38px, 5vw, 64px);
}

.subtitle {
    max-width: 720px;
    margin: 0 auto;
    color: #d9e5e8;
    font-size: 18px;
    line-height: 1.5;
}

.intro {
    margin-top: 18px;
    color: #ffa654;
    font-weight: 700;
}

/* CALENDAR */

.calendar {
    width: min(1100px, 94%);
    margin: 30px auto 60px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 18px;
}

.door {
    position: relative;
    min-height: 150px;
    border: 0;
    border-radius: 18px;
    cursor: pointer;

    background: linear-gradient(145deg, #ffffff, #e8edef);
    color: #16323b;

    box-shadow: 0 12px 26px rgba(0,0,0,.28);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.door:hover {
    transform: translateY(-7px);
    box-shadow: 0 20px 35px rgba(0,0,0,.38);
}

.door.special {
    background: linear-gradient(145deg, #ff8a16, #eb6100);
    color: white;
}

.door.locked {
    opacity: .55;
}

.door-number {
    font-size: 44px;
    font-weight: 800;
}

.door-text {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    opacity: .7;
}

.lock {
    position: absolute;
    top: 12px;
    right: 14px;
}

.decoration {
    position: absolute;
    right: 10px;
    bottom: 2px;
    font-size: 38px;
    opacity: .15;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(2,13,18,.86);
    backdrop-filter: blur(8px);
}

.modal.show {
    display: flex;
}

.card {
    position: relative;

    width: min(630px, 100%);
    max-height: 90vh;
    overflow-y: auto;

    padding: 45px;

    text-align: center;

    background: white;
    color: #17303a;

    border-radius: 28px;

    box-shadow: 0 35px 90px rgba(0,0,0,.5);

    animation: openCard .35s ease;
}

@keyframes openCard {

    from {
        opacity: 0;
        transform: scale(.85) translateY(30px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.close {
    position: absolute;
    top: 15px;
    right: 20px;

    border: 0;
    background: transparent;

    color: #718087;

    font-size: 30px;
    cursor: pointer;
}

.date {
    color: #ef6500;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 13px;
    text-transform: uppercase;
}

.reveal {
    margin-top: 20px;
    color: #738289;
}

.person {
    margin: 8px 0 24px;

    font-size: 38px;
    line-height: 1.15;

    color: #123440;
}

.message {
    max-width: 510px;
    margin: 15px auto;

    color: #465b63;

    font-size: 18px;
    line-height: 1.65;
}

.draft {
    margin: 25px 0;
    padding: 22px;

    text-align: left;

    background: #fff6ed;
    border-left: 5px solid #ff7200;
    border-radius: 10px;

    line-height: 1.55;
}

.draft-title {
    color: #ef6500;
    font-weight: 800;
}

.next {
    margin-top: 30px;
    padding-top: 25px;

    border-top: 1px solid #dde4e6;

    color: #53676e;
    line-height: 1.5;
}

.next strong {
    display: block;

    margin-bottom: 8px;

    color: #ef6500;

    font-size: 21px;
}

/* PREVIEW */

.preview-box {
    position: fixed;
    right: 15px;
    bottom: 15px;
    z-index: 50;
}

.preview-button {
    padding: 11px 17px;

    border: 0;
    border-radius: 25px;

    background: #ff7200;
    color: white;

    font-weight: 800;
    cursor: pointer;

    box-shadow: 0 8px 22px rgba(0,0,0,.3);
}

footer {
    padding: 5px 20px 40px;

    text-align: center;

    color: #99afb6;
}

/* RESPONSIVE */

@media (max-width: 850px) {

    .calendar {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (max-width: 550px) {

    .calendar {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .door {
        min-height: 110px;
    }

    .door-number {
        font-size: 32px;
    }

    .card {
        padding: 42px 22px 28px;
    }

    .person {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>

<div class="eyebrow">
DECEMBER 2026
</div>

<h1>
🎄 Quality Advent Calendar
</h1>

<p class="subtitle">
Behind every door, there's someone who makes a difference.
Open one door each day and discover who we're celebrating.
</p>

<p class="intro">
18 people. 18 personal messages. 6 messages for all of us. ✨
</p>

</header>


<main class="calendar" id="calendar"></main>


<footer>
One day. One door. One little surprise. 🧡
</footer>


<!-- PREVIEW BUTTON -->

<div class="preview-box">

<button
class="preview-button"
id="previewButton"
onclick="togglePreview()">

🛠 Preview Mode: ON

</button>

</div>


<!-- POPUP -->

<div class="modal" id="modal">

<div class="card">

<button
class="close"
onclick="closeModal()">

×
</button>

<div id="modalContent"></div>

</div>

</div>


<script>

/* =========================================================
   PREVIEW MODE

   TRUE = all doors open
   FALSE = doors unlock by date
========================================================= */

let previewMode = true;


/* =========================================================
   PEOPLE + MESSAGES

   Search for DRAFT when you want to replace messages.
========================================================= */

const days = [

{
    day: 1,
    name: "Patrick Levot",
    message: "DRAFT — Add Patrick's personalised message here."
},

{
    day: 2,
    name: "Vanna Fang",
    message: "DRAFT — Add Vanna's personalised message here."
},

{
    day: 3,
    name: "Alexander Heinzelmann",
    message: "DRAFT — Add Alexander's personalised message here."
},

{
    day: 4,
    name: "Danielly Ferreira",
    message: "DRAFT — Add Danielly's personalised message here."
},

{
    day: 5,
    name: "Andrzej Ilyk",
    message: "DRAFT — Add Andrzej's personalised message here."
},

{
    day: 6,
    name: "Claire Connor",
    message: "DRAFT — Add Claire's personalised message here."
},

{
    day: 7,
    name: "Mitzy Borquez",
    message: "DRAFT — Add Mitzy's personalised message here."
},

{
    day: 8,
    name: "Keith Negapatan",
    message: "DRAFT — Add Keith's personalised message here."
},

{
    day: 9,
    name: "Ioana Sandu",
    message: "DRAFT — Add Ioana's personalised message here."
},

{
    day: 10,
    name: "Carsten Aue",
    message: "DRAFT — Add Carsten's personalised message here."
},

{
    day: 11,
    name: "Geodesa Pongan",
    message: "DRAFT — Add Geodesa's personalised message here."
},

{
    day: 12,
    name: "Phil Morton",
    message: "DRAFT — Add Phil's personalised message here."
},

{
    day: 13,
    name: "Josephine Luk",
    message: "DRAFT — Add Josephine's personalised message here."
},

{
    day: 14,
    name: "Sachin Dighe",
    message: "DRAFT — Add Sachin's personalised message here."
},

{
    day: 15,
    name: "Ann Van de Sype",
    message: "DRAFT — Add Ann's personalised message here."
},

{
    day: 16,
    name: "Nadia Scotti",
    message: "DRAFT — Add Nadia's personalised message here."
},

{
    day: 17,
    name: "Sarah Morris",
    message: "DRAFT — Add Sarah's personalised message here."
},

{
    day: 18,
    name: "Judith Calvo",
    message: "DRAFT — Add Judith's personalised message here."
},

/* =========================
   TEAM MESSAGES
========================= */

{
    day: 19,
    special: true,
    title: "What we achieved together ✨",
    message: "Behind every achievement this year, there were people sharing ideas, solving problems, supporting one another and learning together. Thank you for everything we have achieved as a team. Every contribution, big or small, has helped us move forward."
},

{
    day: 20,
    special: true,
    title: "Thank you for making a difference 🧡",
    message: "Quality is not only about processes, standards and systems. It is also about people, collaboration and the choices we make every day. Thank you for your commitment, your support, your ideas and all the small actions that make a real difference."
},

{
    day: 21,
    special: true,
    title: "Better together 🤝",
    message: "Different countries, experiences, perspectives and ideas make our Quality community stronger. Thank you for sharing your knowledge, supporting one another and reminding us that we achieve more when we work together."
},

{
    day: 22,
    special: true,
    title: "What we learned this year 🌱",
    message: "Every challenge brings an opportunity to learn. Every conversation, lesson learned and shared experience helps us become better. Thank you for being open to learning, sharing and continuously improving together."
},

{
    day: 23,
    special: true,
    title: "Looking ahead ⭐",
    message: "Another year is almost behind us, but new opportunities, ideas and challenges are already waiting. Let's continue learning from one another, sharing what works, improving what we can and supporting each other along the way."
},

{
    day: 24,
    special: true,
    title: "One team. Many people. One journey. 🎄",
    message: "Over the last 18 days, we have celebrated the people who make our Quality community what it is. Today, the final door belongs to all of us. Thank you for your commitment, support, ideas and everything you have brought to the team this year. Wishing you a wonderful Christmas and a well-deserved break. See you in the new year! 🧡"
}

];


/* =========================================================
   PAGE ELEMENTS
========================================================= */

const calendar = document.getElementById("calendar");

const modal = document.getElementById("modal");

const modalContent =
document.getElementById("modalContent");

const previewButton =
document.getElementById("previewButton");


/* =========================================================
   CHECK IF DOOR CAN OPEN
========================================================= */

function isDoorAvailable(day) {

    if (previewMode === true) {
        return true;
    }

    const today = new Date();

    const year = today.getFullYear();
    const month = today.getMonth();
    const currentDay = today.getDate();

    if (year < 2026) {
        return false;
    }

    if (year > 2026) {
        return true;
    }

    /* January-November */

    if (month < 11) {
        return false;
    }

    /* After December */

    if (month > 11) {
        return true;
    }

    /* December 2026 */

    return currentDay >= day;
}


/* =========================================================
   CREATE DOORS
========================================================= */

function buildCalendar() {

    calendar.innerHTML = "";

    days.forEach(function(item) {

        const available =
        isDoorAvailable(item.day);

        const door =
        document.createElement("button");

        door.classList.add("door");

        if (item.special) {
            door.classList.add("special");
        }

        if (!available) {
            door.classList.add("locked");
        }

        let symbol = "❄️";

        if (item.day % 3 === 0) {
            symbol = "🎄";
        }
        else if (item.day % 2 === 0) {
            symbol = "⭐";
        }

        door.innerHTML =

        '<span class="lock">' +
        (available ? '✨' : '🔒') +
        '</span>' +

        '<span class="door-number">' +
        item.day +
        '</span>' +

        '<span class="door-text">' +
        (item.special
        ? 'A little something...'
        : "Who's inside?") +
        '</span>' +

        '<span class="decoration">' +
        symbol +
        '</span>';

        door.addEventListener(
            "click",
            function() {
                openDoor(item);
            }
        );

        calendar.appendChild(door);

    });

}


/* =========================================================
   OPEN A DOOR
========================================================= */

function openDoor(item) {

    if (!isDoorAvailable(item.day)) {

        modalContent.innerHTML =

        '<div style="font-size:55px;">🔒</div>' +

        '<div class="date">December ' +
        item.day +
        '</div>' +

        '<h2>Not yet!</h2>' +

        '<p class="message">' +
        'This door is still keeping its secret. ' +
        'Come back on December ' +
        item.day +
        ' to discover the next surprise. 🎁' +
        '</p>' +

        '<div class="next">' +
        '<strong>Who will be next? 👀</strong>' +
        'Christmas surprises are worth waiting for.' +
        '</div>';

        modal.classList.add("show");

        return;
    }


    /* PERSON */

    if (!item.special) {

        let nextMessage = "";

        if (item.day < 18) {

            nextMessage =

            '<strong>Could you be next? 👀</strong>' +
            "There's only one way to find out..." +
            '<br>Come back tomorrow! 🎁';

        }

        else {

            nextMessage =

            '<strong>We have celebrated 18 wonderful people... ✨</strong>' +
            "But our Advent Calendar isn't over yet." +
            '<br>There is still something waiting behind tomorrow\'s door. 🎁';

        }


        modalContent.innerHTML =

        '<div class="date">' +
        'December ' +
        item.day +
        '</div>' +

        '<div class="reveal">' +
        "Today, we're celebrating..." +
        '</div>' +

        '<h2 class="person">' +
        '✨ ' +
        item.name +
        ' ✨' +
        '</h2>' +

        '<p class="message">' +
        'Today, this door is especially for you.' +
        '</p>' +

        '<div class="draft">' +

        '<div class="draft-title">' +
        'PERSONAL MESSAGE — DRAFT' +
        '</div>' +

        '<br>' +

        item.message +

        '</div>' +

        '<p class="message">' +
        '🧡 Thank you for being part of our Quality community.' +
        '</p>' +

        '<div class="next">' +
        nextMessage +
        '</div>';

    }


    /* GENERAL MESSAGE */

    else {

        let ending = "";

        if (item.day < 24) {

            ending =

            '<div class="next">' +

            '<strong>' +
            "There's more to come... 🎄" +
            '</strong>' +

            'Come back tomorrow and open the next door.' +

            '</div>';

        }

        else {

            ending =

            '<div class="next">' +

            '<strong>' +
            'Merry Christmas! 🎄🧡' +
            '</strong>' +

            'Thank you for being part of this journey.' +

            '</div>';

        }


        modalContent.innerHTML =

        '<div class="date">' +
        'December ' +
        item.day +
        '</div>' +

        '<h2 class="person">' +
        item.title +
        '</h2>' +

        '<p class="message">' +
        item.message +
        '</p>' +

        ending;

    }


    modal.classList.add("show");

}


/* =========================================================
   CLOSE POPUP
========================================================= */

function closeModal() {

    modal.classList.remove("show");

}


modal.addEventListener(
    "click",
    function(event) {

        if (event.target === modal) {
            closeModal();
        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {
            closeModal();
        }

    }
);


/* =========================================================
   PREVIEW MODE
========================================================= */

function togglePreview() {

    previewMode = !previewMode;

    if (previewMode) {

        previewButton.textContent =
        "🛠 Preview Mode: ON";

    }

    else {

        previewButton.textContent =
        "🛠 Preview Mode: OFF";

    }

    buildCalendar();

}


/* =========================================================
   START
========================================================= */

buildCalendar();

</script>

</body>
</html>
